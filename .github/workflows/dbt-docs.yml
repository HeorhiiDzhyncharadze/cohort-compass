name: dbt docs → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate dbt docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Write CI profiles.yml (in-memory DuckDB)
        run: |
          printf 'cohort_compass:\n  target: ci\n  outputs:\n    ci:\n      type: duckdb\n      path: ":memory:"\n      threads: 1\n' > dbt/profiles.yml

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps --profiles-dir .

      - name: dbt docs generate
        working-directory: dbt
        run: uv run dbt docs generate --profiles-dir . --no-compile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

[project]
name = "cohort-compass"
version = "0.1.0"
description = "End-to-end retention & LTV analytics platform on 285M e-commerce events."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "streamlit>=1.38.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "kaggle>=1.6.17",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["ml/tests", "app/tests", "scripts/tests"]
addopts = "-v --tb=short"
